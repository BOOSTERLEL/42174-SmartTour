name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_API_KEY: ci-dummy
      SMARTOUR_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SMARTOUR_SQLITE_PATH: data/smartour-ci.sqlite3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache uv packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install backend dependencies
        run: uv sync --dev

      - name: Run backend tests
        run: uv run pytest -q

      - name: Run Python lint
        run: uv run ruff check src scripts tests

      - name: Run Python type check
        run: uv run mypy src tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-dummy
      NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: DEMO_MAP_ID
      NEXT_PUBLIC_SMARTOUR_API_BASE_URL: http://127.0.0.1:8000/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm exec prettier --check src/app src/components src/lib

      - name: Run frontend lint
        run: pnpm exec eslint .

      - name: Run frontend type check
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build
